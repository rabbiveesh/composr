name: Publish

# Cut a release by pushing a version tag:
#   git tag -a v1.2.3 -m "..." && git push origin v1.2.3
# This builds + tests, publishes to crates.io via OIDC trusted publishing
# (no stored token — see the README/below), then opens a GitHub release
# whose body is the tag commit's message body.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo test --locked

  crates:
    name: Publish to crates.io
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # mint a short-lived crates.io token via OIDC
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  github:
    name: GitHub release
    needs: crates
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the release
    steps:
      - uses: actions/checkout@v4
      - name: Extract release notes from the tag commit
        id: notes
        run: |
          body=$(git log -1 --format=%b)
          echo "body<<EOF" >> "$GITHUB_OUTPUT"
          echo "$body" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.notes.outputs.body }}
          generate_release_notes: true
