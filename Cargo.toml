[package]
name = "composr"
version = "1.0.0"
edition = "2021"
rust-version = "1.80"
description = "Fast Rust install + dump-autoload for Composer projects (vowels not included)"
license = "MIT"
repository = "https://github.com/rabbiveesh/composr"
homepage = "https://github.com/rabbiveesh/composr"
readme = "README.md"
keywords = ["composer", "php", "autoload", "laravel", "install"]
categories = ["command-line-utilities", "development-tools"]
# assets/ is embedded via include_bytes! at build time — never exclude it.
exclude = ["scripts/", "tests/"]

[[bin]]
name = "composr"
path = "src/main.rs"
required-features = ["cli"]

[lib]
name = "composr"
path = "src/lib.rs"

[features]
default = ["cli"]
# Everything except the composer.json / composer.lock / installed.json readers
# (`config`, `lock`, `installed`). Library users who only need those can set
# `default-features = false` and skip tree-sitter, tokio, reqwest, zip, clap...
cli = [
    "dep:clap",
    "dep:ignore",
    "dep:rayon",
    "dep:tree-sitter",
    "dep:tree-sitter-php",
    "dep:bincode",
    "dep:sha1",
    "dep:sha2",
    "dep:hex",
    "dep:globset",
    "dep:tracing-subscriber",
    "dep:memchr",
    "dep:num_cpus",
    "dep:tokio",
    "dep:reqwest",
    "dep:futures",
    "dep:zip",
    "dep:tempfile",
    "dep:indicatif",
    "dep:url",
]

[dependencies]
clap = { version = "4", features = ["derive"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
ignore = { version = "0.4", optional = true }
rayon = { version = "1.10", optional = true }
tree-sitter = { version = "0.25", optional = true }
tree-sitter-php = { version = "0.25", optional = true }
bincode = { version = "2", features = ["serde"], optional = true }
sha1 = { version = "0.10", optional = true }
sha2 = { version = "0.10", optional = true }
hex = { version = "0.4", optional = true }
globset = { version = "0.4", optional = true }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
memchr = { version = "2", optional = true }
num_cpus = { version = "1", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "process", "sync", "io-util"], optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "gzip"], optional = true }
futures = { version = "0.3", optional = true }
zip = { version = "2", default-features = false, features = ["deflate", "bzip2"], optional = true }
tempfile = { version = "3", optional = true }
indicatif = { version = "0.17", optional = true }
url = { version = "2", optional = true }

[[test]]
name = "spi_real_world"
required-features = ["cli"]

[dev-dependencies]
pretty_assertions = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
