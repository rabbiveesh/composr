[package]
name = "composr"
version = "0.2.0"
edition = "2021"
rust-version = "1.80"
description = "Fast Rust install + dump-autoload for Composer projects (vowels not included)"
license = "MIT"

[[bin]]
name = "composr"
path = "src/main.rs"

# `autoload-dumpr` is kept as an alias binary so existing scripts that
# invoke the old name keep working.
[[bin]]
name = "autoload-dumpr"
path = "src/main.rs"

[lib]
name = "composr"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
ignore = "0.4"
rayon = "1.10"
tree-sitter = "0.22"
tree-sitter-php = "0.22"
bincode = { version = "2", features = ["serde"] }
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
globset = "0.4"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
memchr = "2"
fs2 = "0.4"
num_cpus = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "process", "sync", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "gzip"] }
futures = "0.3"
zip = { version = "2", default-features = false, features = ["deflate", "bzip2"] }
tempfile = "3"
indicatif = "0.17"
url = "2"

[dev-dependencies]
pretty_assertions = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
